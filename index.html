<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MentaLeap // Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background-color: #0d1117;
            --primary-text-color: #f1f3f5;
            --secondary-text-color: #ced4da;
            --accent-color: #00aaff;
            --border-color: rgba(241, 243, 245, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--primary-text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            padding: 30px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1px;
            color: var(--primary-text-color);
            margin-bottom: 0.2rem;
        }
        
        .logo .accent {
            color: var(--accent-color);
        }

        .mission {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            color: var(--secondary-text-color);
            margin-bottom: 4rem; /* Increased margin for spacing */
        }

        #countdown {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 3rem;
        }

        .time-block {
            display: flex;
            flex-direction: column;
        }

        .time-block .number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-text-color);
            line-height: 1;
        }

        .time-block .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
            color: var(--secondary-text-color);
        }

        .access-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 3rem;
        }

        .access-form input[type="email"] {
            font-family: 'Inter', sans-serif;
            padding: 12px 20px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            color: var(--primary-text-color);
            font-size: 1rem;
            width: 100%;
            max-width: 400px;
            transition: border-color 0.3s;
        }

        .access-form input[type="email"]::placeholder {
            color: var(--secondary-text-color);
            opacity: 0.6;
        }

        .access-form input[type="email"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .access-form button {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 1rem;
            letter-spacing: 0.5px;
            padding: 12px 30px;
            border-radius: 4px;
            border: none;
            background-color: var(--primary-text-color);
            color: var(--background-color);
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
            width: 100%;
            max-width: 400px;
        }

        .access-form button:hover {
            background-color: var(--accent-color);
            color: #fff;
        }
        
        .social-icons {
            margin-top: 2rem;
        }

        .social-icons a {
            color: var(--secondary-text-color);
            margin: 0 15px;
            text-decoration: none;
            transition: color 0.3s;
            font-size: 1.1rem;
        }
        
        .social-icons a:hover {
            color: var(--accent-color);
        }

        footer {
            margin-top: 4rem;
            font-size: 0.8rem;
            color: var(--secondary-text-color);
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .logo { font-size: 2.5rem; }
            .mission { font-size: 1rem; margin-bottom: 3rem; }
            .time-block .number { font-size: 2rem; }
            .access-form input[type="email"], .access-form button { max-width: none; }
        }
        
        @media (max-width: 480px) {
            .logo { font-size: 2rem; }
            #countdown { gap: 15px; }
            .time-block .number { font-size: 1.5rem; }
            .access-form button { padding: 10px 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="logo">Menta<span class="accent">Leap</span></h1>
        <p class="mission">Reverse Engineering Intelligence</p>

        <div id="countdown">
            <div class="time-block">
                <span id="days" class="number">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-block">
                <span id="hours" class="number">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-block">
                <span id="minutes" class="number">00</span>
                <span class="label">Minutes</span>
            </div>
            <div class="time-block">
                <span id="seconds" class="number">00</span>
                <span class="label">Seconds</span>
            </div>
        </div>

        <form class="access-form" action="#" method="post">
            <input type="email" name="email" placeholder="Enter your email to join the waitlist" required>
            <button type="submit">Join Waitlist</button>
        </form>

        <div class="social-icons">
            <a href="#">LinkedIn</a>
            <a href="#">Twitter</a>
            <a href="#">GitHub</a>
        </div>

        <footer>
            <p>&copy; 2025 MentaLeap. All Rights Reserved.</p>
        </footer>
    </div>

    <script>
        // --- COUNTDOWN TIMER SCRIPT ---
        // Set your launch date and time.
        const launchDate = new Date("October 17, 2025 10:00:00").getTime();

        const countdownInterval = setInterval(function() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            const formatTime = (time) => time < 10 ? `0${time}` : time;

            document.getElementById("days").innerText = formatTime(days);
            document.getElementById("hours").innerText = formatTime(hours);
            document.getElementById("minutes").innerText = formatTime(minutes);
            document.getElementById("seconds").innerText = formatTime(seconds);

            if (distance < 0) {
                clearInterval(countdownInterval);
                document.querySelector(".mission").innerText = "MentaLeap is Now Live!";
                document.getElementById("countdown").innerHTML = "<p>Visit our website to learn more.</p>";
                document.querySelector(".access-form").style.display = "none";
                document.querySelector(".social-icons").style.display = "none";
            }
        }, 1000);
    </script>

</body>
</html>
