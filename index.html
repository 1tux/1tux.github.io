<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MentaLeap | Coming Soon</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- Google Fonts - Roboto with thin weight -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;400;700&display=swap" rel="stylesheet">
  <!-- Google Fonts - Inter for other text elements (if still desired, otherwise can be removed) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      font-family: 'Inter', sans-serif; /* Default font for body text */
      font-weight: 100; /* Set to thin weight */
    }
    /* Overall gradient for the entire title - Green to Blue! */
    .full-title-gradient {
      background: linear-gradient(to right, #00ee80, #009bee); /* Bright Green to Vibrant Blue */
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent; /* Fallback for browsers that don't support text fill color */
      font-family: 'Roboto', sans-serif; /* Changed font of entire title to Roboto */
      font-weight: 50; /* Set to thin weight */
      font-stretch: condensed;
    }
    .highlight {
      font-weight: 1; /* Set to thin weight */
      font-family: 'Inter', sans-seri;
      font-size: 125%;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen text-white text-center px-6">
  <div class="max-w-2xl w-full px-6 py-20">
    <h1 class="text-6xl sm:text-7xl font-extrabold tracking-tight mb-4 leading-tight full-title-gradient">
      menta<em class="highlight">l</em>eap
    </h1>
    <p class="text-base text-slate-400 italic mb-10">Reverse Engineering Intelligence</p>
    <!-- Coming Soon text color to complement the new green-to-blue gradient -->
    <p class="text-2xl text-[#00c6ff] font-semibold mb-2">Coming Soon</p>
  </div>
</body>
</html>
