<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MentaLeap | Coming Soon</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- Google Fonts - Dancing Script for the entire title -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
  <!-- Google Fonts - Inter for other text elements -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      font-family: 'Inter', sans-serif; /* Default font for body text */
    }
    /* Overall gradient for the entire title - Green to Blue! */
    .full-title-gradient {
      background: linear-gradient(to right, #00ff80, #007bff); /* Bright Green to Vibrant Blue */
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent; /* Fallback for browsers that don't support text fill color */
      font-family: 'Dancing Script', cursive; /* Changed font of entire title to Dancing Script */
      // font-weight: 700; /* Ensure it's bold for better readability */
    }
    /* Highlight for the 'l' using text-shadow, less shiny and gold-toned */
    .highlight-l {
      font-size: 111%;
      font-family: 'Dancing Script';
      /* Further reduced opacity and changed shadow color to a subtle gold */
      text-shadow: 0 0 4px rgba(255, 215, 0, 0.3), /* Gold color, less strong glow */
                   0 0 8px rgba(255, 215, 0, 0.15); /* Wider, softer, and very subtle gold glow */
      /* No font-style or font-family needed here, as it's inherited and overridden by parent */
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen text-white text-center px-6">
  <div class="max-w-2xl w-full px-6 py-20">
    <h1 class="text-6xl sm:text-7xl font-extrabold tracking-tight mb-4 leading-tight full-title-gradient">
      Menta<em class="highlight-l">l</em>eap
    </h1>
    <p class="text-base text-slate-400 italic mb-10">Reverse Engineering Intelligence</p>
    <!-- Changed Coming Soon text color to complement the new green-to-blue gradient -->
    <p class="text-2xl text-[#00c6ff] font-semibold mb-2">Coming Soon</p>
    <footer class="text-sm text-slate-500">
      <span>© 2025 MentaLeap</span>
    </footer>
  </div>
</body>
</html>
